name: ci
on: [push, pull_request]
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            setup: >-
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
              g++ cmake ninja-build git pkgconf libssl-dev zlib1g-dev libwebp-dev libgtest-dev
          - image: fedora:latest
            setup: >-
              dnf install -y -q gcc-c++ cmake ninja-build git pkgconf
              openssl-devel zlib-devel libwebp-devel gtest-devel
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed base-devel cmake ninja git openssl zlib libwebp gtest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja pkgconf openssl@3 webp googletest
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
