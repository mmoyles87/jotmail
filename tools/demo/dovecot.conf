# A throwaway IMAP server for trying jotmail: any user name, password "demo".
protocols = imap
listen = *
ssl = required
ssl_cert = </etc/dovecot/demo/cert.pem
ssl_key = </etc/dovecot/demo/key.pem
auth_mechanisms = plain login
passdb {
  driver = static
  args = password=demo
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
mail_location = maildir:~/Maildir
first_valid_uid = 1000
last_valid_uid = 1000
namespace inbox {
  inbox = yes
  separator = /
  mailbox Notes {
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
log_path = /dev/stdout
